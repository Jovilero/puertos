[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puertos"
version = "0.1.0"
description = "Utilidad de puertos TCP locales: comprobar, buscar libre y escanear, con identificación del proceso ocupante."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jovilero" }]
license = { text = "MIT" }
keywords = ["puertos", "ports", "socket", "netstat", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

# psutil es OPCIONAL: mejora la identificación del proceso ocupante y la hace
# más portable. Sin él se cae a netstat/tasklist (Windows) o ss (Linux).
[project.optional-dependencies]
proceso = ["psutil>=5.9"]
dev = ["pytest>=7", "black", "ruff", "mypy"]

[project.scripts]
puertos = "puertos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/puertos"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
